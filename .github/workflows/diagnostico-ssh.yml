# Sonda de diagnóstico, no despliega nada. Se dispara solo en `ci-ssh-debug`.
#
# La primera versión midió mal: pedía 120 bytes del banner cuando un banner SSH son
# unos 40, así que se quedaba esperando y parecía que el servidor callaba. Lo que sí
# dejó claro es que el TCP entra en 0 s, o sea que los 134 s del deploy no son de red.
# Esta versión va al handshake y a la autenticación, que es donde queda el problema.
name: Diagnóstico SSH

on:
  push:
    branches: [ci-ssh-debug]

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Entorno del runner
        continue-on-error: true
        run: |
          echo "IP: $(curl -s --max-time 10 https://api.ipify.org || echo desconocida)"
          ssh -V 2>&1
          grep PRETTY_NAME /etc/os-release

      - name: Banner del servidor (lectura de una línea)
        continue-on-error: true
        run: |
          ini=$(date +%s)
          linea=$(timeout 15 bash -c '
            exec 3<>/dev/tcp/178.16.128.189/65002
            IFS= read -r -t 10 l <&3 && echo "$l"
          ' 2>/dev/null)
          if [ -n "$linea" ]; then
            echo "BANNER: $linea   (en $(( $(date +%s) - ini ))s)"
          else
            echo "SIN BANNER tras $(( $(date +%s) - ini ))s: el servidor acepta TCP y no saluda"
          fi

      - name: Handshake y autenticación con la llave real
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "--- huella de la llave (no expone la privada) ---"
          ssh-keygen -lf ~/.ssh/deploy_key || echo "la llave no se pudo leer"
          echo "--- ssh -vvv, acotado a 60 s ---"
          ini=$(date +%s)
          timeout 60 ssh -vvv -i ~/.ssh/deploy_key -p 65002 \
            -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 \
            u749405456@178.16.128.189 'echo REMOTO-OK' 2>&1 | tail -60
          echo "--- terminó en $(( $(date +%s) - ini ))s ---"
