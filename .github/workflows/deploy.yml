# Final Deployment - Clean State
name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Project
        run: pnpm run build
        env:
          # WEB: se incrusta en el bundle, restringida por referrer al dominio.
          GOOGLE_MAPS_API_KEY_WEB: ${{ secrets.GOOGLE_MAPS_API_KEY_WEB }}
          # BUILD: la usan los scripts de sync desde Node, sin restricción de referrer.
          GOOGLE_MAPS_API_KEY_BUILD: ${{ secrets.GOOGLE_MAPS_API_KEY_BUILD }}

      - name: 🚀 Deploy to Hostinger via rsync/SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -rlvz \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no -o BatchMode=yes" \
            dist/ "u749405456@178.16.128.189:domains/narbossalon.com/public_html/"
